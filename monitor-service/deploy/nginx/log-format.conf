# Include inside http {}. Never use $request_uri directly in the log: it includes queries.
map $request_uri $monitor_path {
    ~^(?<path_without_query>[^?]*) $path_without_query;
}
log_format monitoring_json escape=json
    '{"schema_version":"1",'
    '"application":"application","environment":"production",'
    '"msec":"$msec","request_id":"$request_id",'
    '"method":"$request_method","path":"$monitor_path",'
    '"status":"$status","request_time":"$request_time",'
    '"upstream_status":"$upstream_status",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_header_time":"$upstream_header_time",'
    '"upstream_response_time":"$upstream_response_time",'
    '"bytes_sent":"$bytes_sent"}';
