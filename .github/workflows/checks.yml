name: Monitoring v2 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      primary:
        image: postgres:17-alpine
        env: {POSTGRES_DB: monitoring_v2_test, POSTGRES_USER: monitor, POSTGRES_PASSWORD: test}
        ports: ['56432:5432']
        options: --health-cmd "pg_isready -U monitor -d monitoring_v2_test" --health-interval 5s --health-timeout 3s --health-retries 20
      read:
        image: postgres:17-alpine
        env: {POSTGRES_DB: monitoring_v2_test, POSTGRES_USER: monitor, POSTGRES_PASSWORD: test}
        ports: ['56433:5432']
        options: --health-cmd "pg_isready -U monitor -d monitoring_v2_test" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['56479:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r monitor-service/requirements-dev.txt
      - run: ruff check --config monitor-service/pyproject.toml monitor-service/app/v2 monitor-service/tests
      - run: pytest monitor-service/tests -q
        env: {MONITOR_TEST_DATABASES: '1'}
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run build
      - run: npm test
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python monitor-service/tests/smoke_deploy.py
